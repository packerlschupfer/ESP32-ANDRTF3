; Host-side unit tests for the Arduino-free parts (src/ANDRTF3Registers.h):
;   pio test -e native
; The library itself is built through the examples (see .github/workflows/ci.yml).

[env:native]
platform = native
test_framework = unity
test_filter = test_registers
build_flags = -std=c++17 -Wall -Wextra -Werror -Isrc
